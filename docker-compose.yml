services:
  # api:
  #   build: ./cmd/api/main.go
  #   command: ./bin/api
  #   environment:
  #     REDIS_ADDR: redis:6379
  # worker:
  #   build: ./cmd/worker/main.go
  #   command: ./bin/worker
  #   environment:
  #     REDIS_ADDR: redis:6379
  vosk:
    image: alphacep/kaldi-en:latest
    container_name: medibrain-vosk
    ports:
      - 2700:2700
  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    entrypoint: ["/usr/bin/bash", "/ollama-entrypoint.sh"]
    networks:
      - app-network
  file-storage-master:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9333:9333"
    hostname: seaweedfs_master
    command: "master -ip=seaweedfs_master -port=9333 -mdir=/data"
    restart: unless-stopped
    environment:
      - PUBLIC_URL=http://localhost:9333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - master_data:/data
    networks:
      - app-network
  file-storage-volume:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9000:9000"
    environment:
      - PUBLIC_URL=http:localhost:9000
    hostname: seaweedfs_volume
    command: "volume -dir=/data -publicUrl=localhost:9000 -port=9000 -ip=seaweedfs_volume -mserver=seaweedfs_master:9333"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      file-storage-master:
        condition: service_healthy
    volumes:
      - volume_data:/data
  db:
    image: postgres:16
    container_name: medibrain-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=medibrain
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=1234
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d medibrain || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network
    restart: always
volumes:
  master_data:
  volume_data:
  db_data:
  qdrant_data:
    driver: local
  ollama_data:
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
