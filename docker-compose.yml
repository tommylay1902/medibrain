services:
  server:
    ports:
      - 8080:8080
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      REDIS_ADDR: redis-cache:6379
      SEAWEED_MASTER: file-storage-master:9333 # Add this
      STIRLING_URL: http://stirling:8080/api/v1 # Add this
      STIRLING_API_KEY: your-api-key-here # Add this
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      file-storage-master:
        condition: service_healthy

  worker-server:
    ports:
      - 8081:8081
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      REDIS_ADDR: redis-cache:6379
      SEAWEED_MASTER: file-storage-master:9333 # Add this
      STIRLING_URL: http://stirling:8080/api/v1 # Add this
      STIRLING_API_KEY: your-api-key-here # Add this
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      file-storage-master:
        condition: service_healthy

  vosk:
    image: alphacep/kaldi-en:latest
    container_name: medibrain-vosk
    ports:
      - 2700:2700
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    entrypoint: ["/usr/bin/bash", "/ollama-entrypoint.sh"]
    networks:
      - app-network

  file-storage-master:
    container_name: seaweedfs-master
    image: chrislusf/seaweedfs:latest
    ports:
      - "9333:9333"
    command: "master -ip=file-storage-master -port=9333 -mdir=/data" # Fixed: use service name
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - master_data:/data
    networks:
      - app-network

  file-storage-volume:
    container_name: seaweedfs-volume
    image: chrislusf/seaweedfs:latest
    ports:
      - "9000:9000"
    command: "volume -dir=/data -publicUrl=localhost:9000 -port=9000 -ip=file-storage-volume -mserver=file-storage-master:9333" # Fixed: use service name
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      file-storage-master:
        condition: service_healthy
    volumes:
      - volume_data:/data

  db:
    image: postgres:16
    container_name: medibrain-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=medibrain
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=1234
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d medibrain || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  master_data:
  volume_data:
  db_data:
  qdrant_data:
    driver: local
  ollama_data:
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
